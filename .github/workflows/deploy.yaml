name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  RUMDL_VERSION: "0.1.68"
  TYPST_VERSION: "0.14.2"
  MMDR_VERSION: "0.2.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to commit SHAs; the comment records the
      # version each SHA corresponds to.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: cache bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: cache rumdl (pipx)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.local/pipx
            ~/.local/bin/rumdl
          key: pipx-rumdl-${{ env.RUMDL_VERSION }}-${{ runner.os }}

      - name: install rumdl
        run: pipx install "rumdl==${RUMDL_VERSION}"

      - run: bun install --frozen-lockfile

      - name: quality checks
        run: |
          bun run check
          bun run test

      - name: install typst
        uses: typst-community/setup-typst@48aeee7543d37f01afd1ffb27307dc277387ba13 # v4
        with:
          typst-version: "${{ env.TYPST_VERSION }}"

      - name: cache mmdr
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/bin/mmdr
          key: mmdr-${{ env.MMDR_VERSION }}-${{ runner.os }}

      - name: install mmdr
        run: |
          if [ ! -x "$HOME/.local/bin/mmdr" ]; then
            curl -L "https://github.com/1jehuang/mermaid-rs-renderer/releases/download/v${MMDR_VERSION}/mmdr-x86_64-unknown-linux-gnu.tar.gz" -o mmdr.tar.gz
            tar -xzf mmdr.tar.gz
            mkdir -p "$HOME/.local/bin"
            mv mmdr "$HOME/.local/bin/mmdr"
            chmod +x "$HOME/.local/bin/mmdr"
            rm -f mmdr.tar.gz
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: cache vellume render cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules/.cache/vellume-render
          key: vellume-render-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: vellume-render-${{ runner.os }}-

      - name: write site config overrides
        run: bun ./scripts/write-site-overrides.ts
        env:
          ARTALK_SERVER: ${{ secrets.ARTALK_SERVER }}
          ARTALK_SITE: ${{ secrets.ARTALK_SITE }}
          SITE_URL: https://timfang4162.github.io/astro-theme-vellume

      - run: bun run build
        env:
          SITE_BASE: /astro-theme-vellume

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
